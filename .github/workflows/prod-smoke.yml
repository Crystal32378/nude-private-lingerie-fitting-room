name: One-off production smoke

on:
  pull_request:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect production bundle markers
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nude-virtual-showroom.vercel.app"
          curl -fsS --retry 4 --retry-delay 3 "$BASE/" -o /tmp/home.html
          mapfile -t chunks < <(grep -oE 'src="[^"]+\.js[^"]*"' /tmp/home.html | sed -E 's/^src="([^"]+)"$/\1/' | sort -u)
          : > /tmp/markers.txt
          i=0
          for chunk in "${chunks[@]:-}"; do
            i=$((i+1))
            if [[ "$chunk" == http* ]]; then
              url="$chunk"
            else
              url="$BASE$chunk"
            fi
            if curl -fsS --retry 3 --retry-delay 2 "$url" -o "/tmp/chunk-$i.js"; then
              grep -aohE 'Powered by Perfect Corp YouCam|Perfect Corp YouCam Virtual Try-On|YouCam V3' "/tmp/chunk-$i.js" >> /tmp/markers.txt || true
            fi
          done
          echo "Bundle markers:"
          sort -u /tmp/markers.txt || true

      - name: Run one real cloth-v4 production request
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nude-virtual-showroom.vercel.app"
          curl -fsSL --retry 4 --retry-delay 3 'https://raw.githubusercontent.com/Crystal32378/talk-me-out/dorahacks/launch/public/demo/fallback-person.jpg' -o /tmp/person.jpg
          curl -fsSL --retry 4 --retry-delay 3 'https://img.shoplineapp.com/media/image_clips/5b45bcdd9a76f019bb00103e/original.jpg?1531296988' -o /tmp/garment.jpg

          http_code=$(curl -sS --retry 2 --retry-delay 3 --max-time 170 \
            -o /tmp/response.json \
            -w '%{http_code}' \
            -F 'person=@/tmp/person.jpg;type=image/jpeg' \
            -F 'garment=@/tmp/garment.jpg;type=image/jpeg' \
            -F 'garmentCategory=upper_body' \
            -F 'garmentName=prod-smoke' \
            "$BASE/api/tryon")

          echo "HTTP $http_code"
          python3 - <<'PY'
          import json
          with open('/tmp/response.json', 'r', encoding='utf-8') as f:
              payload = json.load(f)
          image_url = payload.get('imageUrl') or ''
          summary = {
              'ok': payload.get('ok'),
              'fallback': payload.get('fallback'),
              'demo': payload.get('demo'),
              'youcamError': payload.get('youcamError'),
              'imageUrlKind': 'data' if image_url.startswith('data:image/') else ('https' if image_url.startswith('http') else 'missing'),
          }
          print(json.dumps(summary, ensure_ascii=False))
          if payload.get('ok') is not True:
              raise SystemExit('Production VTO did not return ok=true')
          if not (image_url.startswith('data:image/') or image_url.startswith('http')):
              raise SystemExit('Production VTO returned no usable imageUrl')
          PY
